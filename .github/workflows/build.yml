name: Build iPad Zygisk Magisk Module

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d

      - name: Download official zygisk.hpp header
        run: |
          curl -fL -o src/jni/zygisk.hpp \
            https://github.com/topjohnwu/zygisk-module-sample/raw/refs/heads/master/module/jni/zygisk.hpp
          echo "--- isi zygisk.hpp yang terpakai ---"
          head -20 src/jni/zygisk.hpp

      - name: Configure CMake
        run: |
          cmake -S src -B build \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-27

      - name: Build native lib
        run: cmake --build build --verbose

      - name: Package as Magisk module
        run: |
          mkdir -p module/zygisk
          find build -name "*.so"
          cp build/libipad_zygisk.so module/zygisk/arm64-v8a.so
          cd module
          zip -r ../ipad_zygisk_spoof.zip .

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: ipad-zygisk-magisk-module
          path: ipad_zygisk_spoof.zip
